<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أبطال الشطرنج الصغار</title>
<style>
:root{--bg:#fff7e6;--ink:#3b2a1a;--card:#fff;--l:#fde7b0;--d:#e0a458;--acc:#7c5cff;--ok:#2ecc71;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a2e;--ink:#fff3dc;--card:#2d2644;--l:#d9c7a3;--d:#8b6b3d}}
:root[data-theme="dark"]{--bg:#1f1a2e;--ink:#fff3dc;--card:#2d2644;--l:#d9c7a3;--d:#8b6b3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;text-align:center}
h1{font-size:1.4rem;margin:.6rem 0 .2rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:.5rem}
button{font:inherit;border:0;border-radius:16px;padding:.6rem 1rem;background:var(--card);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.2)}
button.on{background:var(--acc);color:#fff}
.wrap{max-width:440px;margin:0 auto;padding:0 8px 24px}
#board{direction:ltr;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));flex:1;min-width:0;aspect-ratio:1;border:4px solid var(--d);border-radius:10px;overflow:hidden}
.bw{direction:ltr;display:flex;gap:6px;margin:.3rem 0;align-items:flex-start}
#evb{width:22px;align-self:stretch;border-radius:8px;overflow:hidden;background:#222;position:relative;border:2px solid var(--d)}
#evf{position:absolute;left:0;right:0;bottom:0;background:#fff;height:50%;transition:height .4s}
.lost{direction:rtl;min-height:2.2rem;font-size:1.5rem;padding:2px 8px;background:var(--card);border-radius:10px;display:flex;gap:2px;align-items:center;flex-wrap:wrap;margin:.2rem 0}
.lost:empty{display:none}
.lost small{font-size:.85rem;margin-inline-end:6px}
.acc{min-height:2.4rem;font-size:1.05rem;margin:.3rem 0}
.sq{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:min(9.6vw,42px);line-height:1;user-select:none;font-family:"Noto Sans Symbols 2","Segoe UI Symbol","DejaVu Sans",sans-serif}
.sq.l{background:var(--l)}.sq.d{background:var(--d)}
.sq.sel{outline:4px solid var(--acc);outline-offset:-4px}
.sq.dot::after{content:"";width:34%;height:34%;border-radius:50%;background:rgba(46,204,113,.85);position:absolute}
.sq.cap::after{width:86%;height:86%;background:none;border:4px solid rgba(231,76,60,.9)}
.sq.star::before{content:"⭐";position:absolute;font-size:70%}
.sq.chk{background:#ff8a80}
.w{color:#fff;text-shadow:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000,0 0 4px #000,0 0 3px #000}
.b{color:#111;text-shadow:0 0 2px #fff,0 0 1px #fff}
.msg{min-height:3.2rem;font-size:1.15rem;margin:.3rem 0}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.stars{font-size:1.2rem}
#pbar{height:10px;background:var(--card);border-radius:8px;overflow:hidden;margin:4px auto;max-width:300px}
#pfill{display:block;height:100%;background:var(--ok);width:0;transition:width .5s}
.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--acc);color:#fff;padding:.7rem 1.2rem;border-radius:20px;font-size:1.3rem;z-index:9;animation:up 1.8s forwards;white-space:nowrap}
@keyframes up{to{opacity:0;top:14%}}
#bp{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:8;align-items:center;justify-content:center;padding:16px}
#bp.on{display:flex}
#bp .card{background:var(--bg);color:var(--ink);border-radius:20px;padding:14px;max-width:380px;width:100%;max-height:80vh;overflow:auto}
.bg{display:flex;align-items:center;gap:10px;text-align:right;padding:6px;opacity:.4}
.bg.got{opacity:1}
.bg i{font-size:1.8rem;font-style:normal}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7c5cff">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="wrap">
<h1>♞ أبطال الشطرنج الصغار</h1>
<div id="sfst" style="font-size:.85rem;opacity:.8">🧠 المحرّك: جاري التحميل...</div>
<div class="stars">⭐ <b id="stars">0</b> &nbsp; 💎 <b id="pts">0</b> &nbsp; <span id="rank"></span></div>
<div id="pbar"><i id="pfill"></i></div>
<button id="bd">🏅 شاراتي</button><div id="bp"></div>
<div class="tabs"><button id="t1" class="on">♟ القطع</button><button id="t2">🎮 العب</button><button id="t3">🧩 تحدّيات</button><button id="t4">📖 دروس</button><button id="t5">🚀 فتحات</button><button id="t6">🏁 نهايات</button></div>
<div class="row" id="pieces"></div>
<div class="msg" id="msg"></div>
<div class="lost" id="lt"></div>
<div class="bw"><div id="evb"><div id="evf"></div></div><div id="board"></div></div>
<div class="lost" id="lb"></div>
<div class="acc" id="acc"></div>
<div class="row" id="ctrl"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>window.Chess||document.write('<script src="chess.min.js"><\/script>')</script>
<script>
const G={k:'♚\uFE0E',q:'♛\uFE0E',r:'♜\uFE0E',b:'♝\uFE0E',n:'♞\uFE0E',p:'♟\uFE0E'};
const $=id=>document.getElementById(id);
let mode='learn',stars=0;
try{stars=+localStorage.getItem('stars')||0}catch(e){}
function addStar(){stars++;$('stars').textContent=stars;try{localStorage.setItem('stars',stars)}catch(e){}}
$('stars').textContent=stars;
function say(t){$('msg').textContent=t;try{const u=new SpeechSynthesisUtterance(t);u.lang='ar';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function sqEl(r,c,html,cls,fn){const d=document.createElement('div');d.className='sq '+((r+c)%2?'d':'l')+' '+(cls||'');if(html)d.innerHTML=html;d.onclick=fn;return d}

/* ---------- الدروس ---------- */
const P={
 p:{n:'البيدق',t:'يمشي للأمام خطوة واحدة (وخطوتين في أول مرة).'},
 r:{n:'القلعة',t:'تمشي في خطوط مستقيمة: للأمام والخلف والجانبين.'},
 b:{n:'الفيل',t:'يمشي في خطوط مائلة (قُطر).'},
 n:{n:'الحصان',t:'يقفز على شكل حرف L ويقدر يقفز فوق القطع!'},
 q:{n:'الوزيرة',t:'أقوى قطعة! تمشي مستقيم ومائل.'},
 k:{n:'الملك',t:'يمشي خطوة واحدة في أي اتجاه. لازم نحميه!'}
};
let L={p:'r',pos:[4,4],tg:null,mv:[]};
function lmoves(p,[r,c]){
 const o=[],add=(a,b)=>{if(a>=0&&a<8&&b>=0&&b<8)o.push([a,b])};
 const ray=ds=>ds.forEach(([a,b])=>{for(let i=1;i<8;i++)add(r+a*i,c+b*i)});
 const S=[[1,0],[-1,0],[0,1],[0,-1]],D=[[1,1],[1,-1],[-1,1],[-1,-1]];
 if(p=='r')ray(S);if(p=='b')ray(D);if(p=='q')ray(S.concat(D));
 if(p=='k')S.concat(D).forEach(([a,b])=>add(r+a,c+b));
 if(p=='n')[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]].forEach(([a,b])=>add(r+a,c+b));
 if(p=='p'){add(r-1,c);if(r==6)add(r-2,c)}
 return o;
}
function pickTarget(){const m=L.mv=lmoves(L.p,L.pos);L.tg=m[Math.floor(Math.random()*m.length)]}
function choose(p){L.p=p;L.pos=p=='p'?[6,4]:[4,4];pickTarget();say(P[p].n+': '+P[p].t+' وصّل '+P[p].n+' إلى النجمة!');drawLearn()}
function drawLearn(){
 $('pieces').innerHTML='';
 for(const k in P){const b=document.createElement('button');b.textContent=G[k]+' '+P[k].n;if(k==L.p)b.className='on';b.onclick=()=>choose(k);$('pieces').appendChild(b)}
 const B=$('board');B.innerHTML='';
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const isP=L.pos[0]==r&&L.pos[1]==c;
  const isM=L.mv.some(m=>m[0]==r&&m[1]==c);
  const isT=L.tg&&L.tg[0]==r&&L.tg[1]==c;
  B.appendChild(sqEl(r,c,isP?G[L.p]:'', (isP?'w ':'')+(isM?'dot ':'')+(isT?'star':''),()=>{
   if(!isM)return;
   if(isT){addStar();addPts(2);L.pos=(L.p=='p'&&r==0)?[6,c]:[r,c];pickTarget();say('أحسنت يا بطل! 🎉 نجمة جديدة!')}
   else{L.pos=[r,c];pickTarget();say('جميل! حاول توصل للنجمة.')}
   drawLearn();
  }))}
 $('ctrl').innerHTML='';$('evb').style.display='none';$('lt').innerHTML=$('lb').innerHTML=$('acc').innerHTML='';
}

/* ---------- اللعب ضد الكمبيوتر ---------- */
let g,sel=null,busy=false;
const val={p:1,n:3,b:3,r:5,q:9,k:0};
function newGame(){g=new Chess();puz=null;evSF=null;hintSq='';sel=null;busy=false;$('acc').innerHTML='';say(two?'لعب مع صديق! الأبيض يبدأ ⚪ مرّروا الموبايل بينكم.':'أنت تلعب بالأبيض. ابدأ! اضغط على قطعة ثم على المكان.');drawPlay()}
function status(){
 if(g.in_checkmate()&&two)return g.turn()=='b'?'كش مات! ⚪ الأبيض فاز 🏆':'كش مات! ⚫ الأسود فاز 🏆';
 if(g.in_checkmate())return g.turn()=='b'?'مات! 🏆 فزت يا بطل!':'مات! الكمبيوتر فاز. جرّب مرة ثانية 💪';
 if(g.in_draw())return 'تعادل 🤝';
 if(g.in_check()&&two)return 'كش! ⚠️ انتبه للملك';
 if(g.in_check())return g.turn()=='w'?'انتبه! ملكك في كش!':'كش! ✔️';
 return '';
}
function drawPlay(){
 $('pieces').innerHTML='';
 const B=$('board');B.innerHTML='';
 const bd=g.board();
 const legal=sel?g.moves({square:sel,verbose:true}):[];
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const s='abcdefgh'[c]+(8-r),pc=bd[r][c];
  const m=legal.find(x=>x.to==s);
  let cls=(pc?(pc.color=='w'?'w ':'b '):'')+(s==sel?'sel ':'')+(m?(pc?'cap ':'dot '):'')+(s==hintSq?'star ':'');
  if(pc&&pc.type=='k'&&pc.color==g.turn()&&g.in_check())cls+=' chk';
  B.appendChild(sqEl(r,c,pc?G[pc.type]:'',cls,()=>tap(s,pc)));
 }
 $('ctrl').innerHTML='<button id="nb">🔄 لعبة جديدة</button><button id="lv">'+LV[lvl]+'</button><button id="md">'+(two?'👫 ضد صديق':'🤖 ضد الكمبيوتر')+'</button><button id="ub">↩️ تراجع</button>'+(two?'':'<button id="hn">💡 نصيحة</button>');
 $('nb').onclick=newGame;$('md').onclick=()=>{two=!two;newGame()};if(two)$('lv').style.display='none';$('lv').onclick=()=>{lvl=(lvl+1)%5;$('lv').textContent=LV[lvl]};if($('hn'))$('hn').onclick=sfHint;renderSide();
 $('ub').onclick=()=>{if(busy)return;g.undo();if(!two)g.undo();evSF=null;sel=null;drawPlay()};
}
function tap(s,pc){
 if(puz)return puzTap(s,pc);
 if(busy||g.game_over())return;
 if(sel){
  const m=g.moves({square:sel,verbose:true}).find(x=>x.to==s);
  if(m){const fenB=g.fen(),fr=sel;const S=(two||SF.ready)?null:scores();g.move({from:sel,to:s,promotion:'q'});if(S)judge(S,sel,s);else if(!two&&SF.ready)sfJudge(fenB,fr,s);hintSq='';sel=null;drawPlay();
   const st=status();
   if(g.game_over()){say(st);if(g.in_checkmate()&&!two){addStar();st.win++;addPts(20*(lvl+1),'فوز!')}return}
   if(two){say(st||(g.turn()=='w'?'دور الأبيض ⚪':'دور الأسود ⚫'));return}
   if(st)say(st);else say('دور الكمبيوتر...');
   busy=true;setTimeout(cpu,600);return}
 }
 sel=(pc&&pc.color==(two?g.turn():'w'))?s:null;drawPlay();
}
function cpu(){
 if(SF.ready&&lvl>0&&!two){sfCpu();return}
 const ms=g.moves({verbose:true});
 if(!ms.length){busy=false;return}
 // مستوى سهل: يفضّل أخذ القطع أحيانًا، وإلا حركة عشوائية
 let pick=ms[Math.floor(Math.random()*ms.length)];
 const caps=ms.filter(m=>m.captured);
 if(caps.length&&Math.random()<0.5)pick=caps.sort((a,b)=>val[b.captured]-val[a.captured])[0];
 if(lvl>0&&Math.random()<(lvl==1?0.6:1)){const S=scores(),mx=Math.max(...S.map(x=>x.v)),top=S.filter(x=>x.v==mx);pick=top[Math.floor(Math.random()*top.length)].m}
 g.move(pick);busy=false;drawPlay();
 const st=status();say(st||'دورك! 😊');
 if(g.in_checkmate()&&g.turn()=='w'){}
}

/* ---------- التقييم والمأكولات ---------- */
const CP={p:100,n:320,b:330,r:500,q:900,k:0};
function ev(){let s=0;const bd=g.board();
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=bd[r][c];if(!p)continue;
  let v=CP[p.type];if(p.type!='k')v+=(3.5-Math.abs(c-3.5))*4+(3.5-Math.abs(r-3.5))*4;
  s+=p.color=='w'?v:-v}
 return s}
function srch(d,a,b){
 if(g.in_checkmate())return -99999;
 if(g.in_draw())return 0;
 if(d==0)return g.turn()=='w'?ev():-ev();
 let best=-1e9;
 for(const m of g.moves()){g.move(m);const v=-srch(d-1,-b,-a);g.undo();
  if(v>best)best=v;if(v>a)a=v;if(a>=b)break}
 return best}
function scores(){return g.moves({verbose:true}).map(m=>{g.move(m.san);const v=-srch(1,-1e9,1e9);g.undo();return{m,v}})}
function judge(S,from,to){
 const best=S.reduce((x,y)=>y.v>x.v?y:x);
 const me=S.find(x=>x.m.from==from&&x.m.to==to);
 const loss=Math.max(0,best.v-me.v);
 const pct=Math.round(Math.max(0,100-loss/6));
 const t=loss<30?'ممتازة ✅':loss<100?'جيدة 👍':loss<250?'غير دقيقة ⚠️':'غلطة ❌';
 $('acc').innerHTML='دقة نقلتك: <b>'+pct+'%</b> '+t+(loss>=100?'<br>الأفضل كان: <b>'+best.m.san+'</b>':'');
}
function renderSide(){
 $('evb').style.display='';
 const lw=[],lb=[];
 g.history({verbose:true}).forEach(m=>{if(m.captured)(m.color=='w'?lb:lw).push(m.captured)});
 const row=(a,col,lab)=>'<small>'+lab+'</small>'+(a.sort((x,y)=>CP[y]-CP[x]).map(t=>'<span class="'+col+'">'+G[t]+'</span>').join('')||'—');
 $('lt').innerHTML=row(lb,'b',two?'الأسود خسر:':'الكمبيوتر خسر:');
 $('lb').innerHTML=row(lw,'w',two?'الأبيض خسر:':'أنت خسرت:');
 const e=g.in_checkmate()?(g.turn()=='w'?-3000:3000):(evSF!=null?evSF:ev());
 $('evf').style.height=(50+50*Math.tanh(e/500))+'%';
}

/* ---------- المستويات والتحديات ---------- */
let lvl=0,puz=null,pi=-1,two=false;
const LV=['😊 المستوى: سهل جدًا','🙂 المستوى: سهل','😎 المستوى: متوسط','🔥 المستوى: صعب','👑 المستوى: خبير'];
const PZ=[
 ['6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1','الملك الأسود محبوس خلف جنوده. القلعة تقدر توصل للصف الأخير!'],
 ['7k/5Q2/6K1/8/8/8/8/8 w - - 0 1','الوزيرة قريبة من الملك، والملك الأبيض يحميها.'],
 ['7k/8/6K1/8/8/8/8/R7 w - - 0 1','القلعة تقدر تمشي بعيد على الصف الأخير.'],
 ['6rk/6pp/8/6N1/8/8/8/6K1 w - - 0 1','الحصان يقفز لمكان يخوّف الملك، والملك محاصر بقطعه!'],
 ['k7/8/1K6/8/8/8/8/6Q1 w - - 0 1','الوزيرة تمشي مستقيم على الخط الطويل.']
];
function newPuz(){pi=(pi+1)%PZ.length;g=new Chess(PZ[pi][0]);puz={done:false};sel=null;busy=false;say('كش مات في نقلة واحدة! ابحث عن النقلة. ⭐');puzDraw()}
function puzDraw(){
 drawPlay();$('evb').style.display='none';$('lt').innerHTML=$('lb').innerHTML=$('acc').innerHTML='';
 $('ctrl').innerHTML='<button id="hb">💡 تلميح</button><button id="nx">التالي ➡️</button>';
 $('nx').onclick=newPuz;
 $('hb').onclick=()=>{const m=g.moves({verbose:true}).find(x=>{g.move(x.san);const k=g.in_checkmate();g.undo();return k});if(m){sel=m.from;say('💡 '+PZ[pi][1]);puzDraw()}};
}
function puzTap(s,pc){
 if(puz.done)return;
 if(sel){
  const m=g.moves({square:sel,verbose:true}).find(x=>x.to==s);
  if(m){
   g.move({from:sel,to:s,promotion:'q'});
   if(g.in_checkmate()){addStar();puz.done=true;sel=null;say('كش مات! 🎉 أحسنت يا بطل!');puzDraw();return}
   g.undo();sel=null;say('ما فيش مات بالنقلة دي 🤔 جرّب تاني!');puzDraw();return;
  }
 }
 sel=(pc&&pc.color=='w')?s:null;puzDraw();
}

/* ---------- ألغاز متدرجة ---------- */
const LVN=['مبتدئ 🌱','متوسط 🌟','متقدم 🔥','محترف 👑','بطل 🏆'],NT=['','نقلة واحدة','نقلتين','3 نقلات'];

function canM(n){for(const m of g.moves()){g.move(m);const ok=g.in_checkmate()||(n>1&&!g.game_over()&&forcedOK(n-1));g.undo();if(ok)return true}return false}
function forcedOK(n){const ms=g.moves();if(!ms.length)return false;for(const m of ms){g.move(m);const ok=canM(n);g.undo();if(!ok)return false}return true}
function hintMove(){
 if(puz.first&&puz.sol.length)return puz.sol[0].slice(0,2);
 for(const m of g.moves({verbose:true})){g.move(m.san);const ok=g.in_checkmate()||(puz.left>1&&!g.game_over()&&forcedOK(puz.left-1));g.undo();if(ok)return m.from}

 if(puz.done||puz.busy)return;
 if(sel){
  const m=g.moves({square:sel,verbose:true}).find(x=>x.to==s);
  if(m){
   const from=sel;sel=null;

   if(!good&&puz.left>1&&!g.game_over())good=(puz.first&&puz.sol.length)?puz.sol.includes(from+s):forcedOK(puz.left-1);
   if(!good){puz.wrong=true;g.undo();puzDraw();say('مش دي النقلة الصح 🤔 جرّب تاني!');return}
   if(g.in_checkmate()){addStar();puz.done=true;puzDraw();puzReward();say('كش مات! 🎉 أحسنت يا بطل!');return}

/* ---------- Stockfish ---------- */
const SF={w:null,ready:false,off:false,q:Promise.resolve(),cur:null};
const SFURL='https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
const SL=[null,[0,100],[5,300],[12,600],[20,1200]];
let evSF=null,hintSq='';
function sfStatus(t){const e=$('sfst');if(e)e.textContent=t}
function sfStart(){
 const tries=[()=>new Worker('stockfish.js'),()=>new Worker(URL.createObjectURL(new Blob(["importScripts('"+SFURL+"')"],{type:'text/javascript'})))];
 let ti=0;
 const next=()=>{
  if(ti>=tries.length){SF.off=true;sfStatus('⚙️ وضع مبسّط (Stockfish غير متاح الآن)');return}
  let w;try{w=tries[ti++]()}catch(e){next();return}
  let done=false;
  const kill=()=>{if(!done){done=true;try{w.terminate()}catch(e){}next()}};
  const tm=setTimeout(kill,20000);
  w.onerror=()=>{clearTimeout(tm);kill()};
  w.onmessage=ev=>{
   const l=typeof ev.data=='string'?ev.data:'';
   if(done)return;
   if(l=='uciok')w.postMessage('isready');
   if(l=='readyok'){done=true;clearTimeout(tm);SF.w=w;SF.ready=true;w.onerror=null;w.onmessage=sfMsg;sfStatus('🧠 Stockfish جاهز ✅')}
  };
  w.postMessage('uci');
 };
 next();
}
function sfMsg(ev){
 const l=typeof ev.data=='string'?ev.data:'',c=SF.cur;
 if(!c)return;
 if(l.startsWith('info')&&l.includes(' score ')){
  const m=l.match(/score (cp|mate) (-?\d+)/);
  if(m)c.score=m[1]=='cp'?+m[2]:(+m[2]>0?1:-1)*(10000-Math.abs(+m[2])*10);
 }else if(l.startsWith('bestmove')){
  const b=l.split(' ')[1];SF.cur=null;c.res({best:b&&b!='(none)'?b:null,score:c.score||0});
 }
}
function sfAsk(fen,o){
 const p=SF.q.then(()=>new Promise(res=>{
  if(!SF.ready){res({best:null,score:0});return}
  SF.cur={res,score:0};
  SF.w.postMessage('setoption name Skill Level value '+(o.skill==null?20:o.skill));
  SF.w.postMessage('position fen '+fen);
  SF.w.postMessage('go movetime '+(o.ms||300));
  setTimeout(()=>{if(SF.cur&&SF.cur.res===res){SF.cur=null;res({best:null,score:0})}},(o.ms||300)+10000);
 }));
 SF.q=p.catch(()=>{});
 return p;
}
function sfCpu(){
 const L=SL[lvl];
 sfAsk(g.fen(),{ms:L[1],skill:L[0]}).then(r=>{
  if(!r.best){busy=false;return}
  g.move({from:r.best.slice(0,2),to:r.best.slice(2,4),promotion:r.best[4]||'q'});
  evSF=-r.score;busy=false;drawPlay();
  const st=status();say(st||'دورك! 😊');
 });
}
async function sfJudge(fenB,from,to){
 const c=new Chess(fenB),bestP=sfAsk(fenB,{ms:200,skill:20});
 c.move({from,to,promotion:'q'});
 let as;
 if(c.in_checkmate())as=10000;
 else if(c.game_over())as=0;
 else{const a=await sfAsk(c.fen(),{ms:200,skill:20});as=-a.score}
 const b=await bestP;
 const loss=Math.max(0,b.score-as),pct=Math.round(Math.max(0,100-loss/6));
 const t=loss<30?'ممتازة ✅':loss<100?'جيدة 👍':loss<250?'غير دقيقة ⚠️':'غلطة ❌';
 let tip='';
 if(loss>=100&&b.best){try{const d=new Chess(fenB);const m=d.move({from:b.best.slice(0,2),to:b.best.slice(2,4),promotion:b.best[4]||'q'});if(m)tip='<br>الأفضل كان: <b>'+m.san+'</b>'}catch(e){}}
 $('acc').innerHTML='دقة نقلتك: <b>'+pct+'%</b> '+t+tip;
 if(!puz&&!two){evSF=as;renderSide()}
}
function sfHint(){
 if(busy||g.game_over()||g.turn()!='w')return;
 if(!SF.ready){say(SF.off?'النصيحة محتاجة Stockfish وهو غير متاح الآن.':'المحرّك لسه بيحمّل... جرّب بعد ثواني ⏳');return}
 say('بفكّر... 🤔');
 sfAsk(g.fen(),{ms:400,skill:20}).then(r=>{
  if(!r.best)return;
  sel=r.best.slice(0,2);hintSq=r.best.slice(2,4);drawPlay();
  say('💡 جرّب القطعة المضيئة ثم النجمة ⭐');
 });
}
